[package]
name = "bedtools"
kind = "tool"
version = "2.31.1"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[meta]
domain = "bio"
categories = ["genomics", "interval-analysis", "genome-arithmetic"]
keywords = ["bed", "gff", "gtf", "vcf", "bam", "intersect", "coverage", "genomic-intervals"]
description = "Genome arithmetic toolkit for interval-based analyses on BED, GFF/GTF, VCF, and BAM files."

[repository]
url = "https://github.com/taffish/bedtools"

[command]
name = "taf-bedtools"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/bedtools:2.31.1-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[upstream]
type = "github"
repo = "arq5x/bedtools2"
license = "MIT"
citation = "Quinlan and Hall 2010"
doi = "10.1093/bioinformatics/btq033"
pmid = "20110278"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 60
exist = ["bedtools", "intersectBed", "sortBed", "genomeCoverageBed"]
test = ["bedtools --version | grep -F 'bedtools v2.31.1' >/dev/null", "bedtools --help >/dev/null", "bedtools intersect -h 2>&1 | grep -F 'Tool:    bedtools intersect' >/dev/null", "bedtools sort -h 2>&1 | grep -F 'Tool:    bedtools sort' >/dev/null", "bedtools merge -h 2>&1 | grep -F 'Tool:    bedtools merge' >/dev/null", "bedtools genomecov -h 2>&1 | grep -F 'Tool:    bedtools genomecov' >/dev/null", "intersectBed -h 2>&1 | grep -F 'Tool:    bedtools intersect' >/dev/null", "printf 'chr1\\t0\\t10\\nchr1\\t20\\t30\\n' >/tmp/taf-bedtools-a.bed && printf 'chr1\\t5\\t12\\n' >/tmp/taf-bedtools-b.bed && printf 'chr1\\t5\\t10\\n' >/tmp/taf-bedtools-expected.bed && bedtools intersect -a /tmp/taf-bedtools-a.bed -b /tmp/taf-bedtools-b.bed | cmp - /tmp/taf-bedtools-expected.bed"]
